name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  # Maintainer-gated review of a fork PR.  The automatic pull_request trigger
  # cannot see secrets on fork PRs, so the `review` job skips them and a
  # maintainer runs this instead, after reading the diff:
  #   gh workflow run ai-pr-review.yml --repo <owner>/<repo> -f pr_number=<N> -f head_sha=<reviewed sha> [-f review_mode=full]
  # Only users with write access can dispatch a workflow.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (read the diff first: fork content is untrusted)"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA you reviewed (40 hex characters). The run fails if the PR head differs."
        required: true
        type: string
      review_mode:
        description: Review mode
        required: false
        default: quick
        type: choice
        options: [quick, full]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # The event name keeps a maintainer dispatch and an automatic run for the
  # same PR in separate groups, so a push to the PR cannot cancel a dispatch.
  group: ai-pr-review-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # `review` is a required check on main.  A fork PR gets no secrets on this
    # trigger, so the review steps below run for same-repo PRs only.  For a
    # fork PR this job fails on purpose.  review-dispatch then posts a check
    # run named `review` on the PR head SHA with the real review result.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'ai-review-full' ||
       github.event.label.name == 'ai-review-rescan')
    runs-on: ubuntu-latest
    steps:
      - name: Hold the required check for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          msg="Fork PR: no automatic AI review ran because this trigger has no secrets. This check stays failed until a maintainer reads the diff and runs: gh workflow run ai-pr-review.yml --repo ${GITHUB_REPOSITORY} -f pr_number=${PR_NUMBER} -f head_sha=${HEAD_SHA}"
          echo "::error title=No AI review for fork PR::${msg}"
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          fetch-depth: 0

      - name: Run AI review
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: tag1consulting/ai-pr-review/container-action@main
        env:
          # ai-review-rescan label forces a full-diff re-review by setting
          # FORCE_FULL_DIFF=true in the container env.  The composite
          # action forwards this env var via `-e FORCE_FULL_DIFF` if set.
          FORCE_FULL_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review-rescan') }}
        with:
          approval-ceiling: ${{ vars.AI_REVIEW_APPROVAL_CEILING || 'request-changes' }}
          suppress-walkthrough: ${{ vars.AI_REVIEW_SUPPRESS_WALKTHROUGH || 'false' }}
          finding-badges: ${{ vars.AI_REVIEW_FINDING_BADGES || 'true' }}
          cost-ceiling-unpriced: ${{ vars.AI_REVIEW_COST_CEILING_UNPRICED || 'warn' }}
          policy-source: ${{ vars.AI_REVIEW_POLICY_SOURCE || 'base-ref' }}
          # vars.AI_REVIEW_IMAGE_TAG pins the container image (default 'latest';
          # this repo dogfoods 'dev' ahead of the Epic 4 default-engine flip).
          image-tag: ${{ vars.AI_REVIEW_IMAGE_TAG || 'latest' }}
          registry-token: ${{ secrets.GHCR_TOKEN }}
          provider: ${{ vars.AI_REVIEW_PROVIDER || 'anthropic' }}
          api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          base-url: ${{ vars.AI_REVIEW_BASE_URL || '' }}
          model-standard: ${{ vars.AI_REVIEW_MODEL_STANDARD || '' }}
          model-premium: ${{ vars.AI_REVIEW_MODEL_PREMIUM || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          review-mode: >-
            ${{
              (contains(github.event.pull_request.labels.*.name, 'ai-review-full') && 'full') ||
              'quick'
            }}
          # vars.AI_PR_REVIEW_ENGINE selects the compute engine (default 'bash';
          # Epic 3 capabilities below require 'python').
          engine: ${{ vars.AI_PR_REVIEW_ENGINE || 'bash' }}
          # vars.AI_REVIEW_IGNORE_MERGE_COMMITS strips upstream base-branch
          # merge commits before diffing (default false).
          ignore-merge-commits: ${{ vars.AI_REVIEW_IGNORE_MERGE_COMMITS || 'false' }}
          # --- Epic 3: opt-in capabilities (Python engine only) ---
          # vars.AI_REVIEW_CONTEXT_ENRICHMENT injects tree-sitter symbol
          # context into agent prompts (default false).
          context-enrichment: ${{ vars.AI_REVIEW_CONTEXT_ENRICHMENT || 'false' }}
          # vars.AI_REVIEW_FEEDBACK_LOOP loads recent /ai-pr-review feedback
          # entries from the ai-pr-review-bot branch (default false).
          feedback-loop: ${{ vars.AI_REVIEW_FEEDBACK_LOOP || 'false' }}
          # vars.AI_REVIEW_FAIL_ON_FINDINGS exits with code 2 when the review
          # outcome is REQUEST_CHANGES or COMMENT, blocking automerge.
          fail-on-findings: ${{ vars.AI_REVIEW_FAIL_ON_FINDINGS || 'false' }}

  # Maintainer-triggered review, used for fork PRs.  Security model:
  #   - workflow_dispatch needs write access, and runs the workflow file from
  #     the default branch, so a fork cannot change this file or the action.
  #   - Fork content is checked out with secrets present in the job, so the
  #     maintainer must read the diff first (prompt injection is still possible).
  #   - persist-credentials is false, so the checkout leaves no token in .git.
  review-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # No checks: write here.  This job hands its token to a container that
    # reads fork content, so the check run is posted by post-review-check.
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      review_outcome: ${{ steps.review.outcome }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be digits only"
            exit 1
          fi
          if ! [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be 40 lowercase hex characters"
            exit 1
          fi
          # --repo pins the lookup to this repository.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid > pr.json
          state=$(jq -r .state pr.json)
          if [[ "$state" != "OPEN" ]]; then
            echo "::error::PR #$PR_NUMBER is $state, not OPEN"
            exit 1
          fi
          # Bind the run to the commit the maintainer reviewed.
          current=$(jq -r .headRefOid pr.json)
          if [[ "$current" != "$REVIEWED_SHA" ]]; then
            echo "::error::PR head is $current, not the reviewed $REVIEWED_SHA. Read the new diff and dispatch again."
            exit 1
          fi
          {
            echo "number=$PR_NUMBER"
            echo "base_ref=$(jq -r .baseRefName pr.json)"
            echo "head_sha=$REVIEWED_SHA"
          } >> "$GITHUB_OUTPUT"
          rm pr.json

      - uses: actions/checkout@v7
        with:
          # refs/pull/N/head exists in the base repo for fork PRs too.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches the resolved head
        env:
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR head moved during checkout ($actual != $EXPECTED_SHA). Re-run after reading the new diff."
            exit 1
          fi

      - name: Run AI review
        id: review
        uses: tag1consulting/ai-pr-review/container-action@main
        env:
          FORCE_FULL_DIFF: 'false'
        with:
          image-tag: ${{ vars.AI_REVIEW_IMAGE_TAG || 'latest' }}
          registry-token: ${{ secrets.GHCR_TOKEN }}
          provider: ${{ vars.AI_REVIEW_PROVIDER || 'anthropic' }}
          api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          base-url: ${{ vars.AI_REVIEW_BASE_URL || '' }}
          model-standard: ${{ vars.AI_REVIEW_MODEL_STANDARD || '' }}
          model-premium: ${{ vars.AI_REVIEW_MODEL_PREMIUM || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.number }}
          base-ref: ${{ steps.pr.outputs.base_ref }}
          head-sha: ${{ steps.pr.outputs.head_sha }}
          review-mode: ${{ inputs.review_mode }}
          engine: ${{ vars.AI_PR_REVIEW_ENGINE || 'bash' }}
          ignore-merge-commits: ${{ vars.AI_REVIEW_IGNORE_MERGE_COMMITS || 'false' }}
          context-enrichment: ${{ vars.AI_REVIEW_CONTEXT_ENRICHMENT || 'false' }}
          feedback-loop: ${{ vars.AI_REVIEW_FEEDBACK_LOOP || 'false' }}
          fail-on-findings: ${{ vars.AI_REVIEW_FAIL_ON_FINDINGS || 'false' }}

  # Posts the dispatched review result as a check run named `review` on the PR
  # head SHA, so the required `review` check reflects it.  It checks out no
  # code and holds only checks: write.  The run is created with GITHUB_TOKEN,
  # so it belongs to the GitHub Actions app.
  post-review-check:
    needs: review-dispatch
    if: always() && needs.review-dispatch.outputs.head_sha != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Post review result as a check on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.review-dispatch.outputs.head_sha }}
          REVIEW_OUTCOME: ${{ needs.review-dispatch.outputs.review_outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$REVIEW_OUTCOME" == "success" ]]; then
            conclusion=success
            summary="A maintainer-dispatched AI review of ${HEAD_SHA} completed. See the run for details."
          else
            conclusion=failure
            summary="A maintainer-dispatched AI review of ${HEAD_SHA} did not succeed (step outcome: ${REVIEW_OUTCOME:-skipped}). See the run for details."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=review \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="$RUN_URL" \
            -f 'output[title]=Maintainer-dispatched AI review' \
            -f "output[summary]=${summary}"

  cleanup-rescan-label:
    needs: review
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Remove ai-review-rescan label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method DELETE \
            repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-review-rescan \
            || true
